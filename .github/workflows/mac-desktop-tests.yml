name: Mac Desktop Companion Python Tests
on:
  push:
    paths:
      - 'mac-desktop/**'
      - '.github/workflows/mac-desktop-tests.yml'
  pull_request:
    paths:
      - 'mac-desktop/**'
      - '.github/workflows/mac-desktop-tests.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python backend (13 tests)
        run: python3 -m unittest discover -s mac-desktop -p 'test_suitecrm_mac.py' -v
